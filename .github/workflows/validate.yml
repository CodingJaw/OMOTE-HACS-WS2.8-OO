name: Validate integration
on:
  push:
    branches: [develop, main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install form test dependencies (versions from HA 2024.9.1)
        run: python -m pip install voluptuous==0.15.2 voluptuous-serialize==2.6.0 aiohttp==3.10.5 cryptography==43.0.1 protobuf==4.25.4
      - name: Download pinned firmware-owned API contract
        run: |
          mkdir -p /tmp/omote-contract
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/CodingJaw/OMOTE-Firmware-WS2.8-OO/eaa98f9d4c8d1ece736da90d30f0ca8bbc1b4413/Platformio/tools/config-v2-tests/config_v2_preview_contract.json \
            -o /tmp/omote-contract/preview.json
          python - <<'PY'
          import json
          from pathlib import Path
          upstream = json.loads(Path('/tmp/omote-contract/preview.json').read_text())
          local = json.loads(Path('tests/fixtures/config_v2_preview_contract.json').read_text())
          assert upstream == local, 'Firmware and HACS API contract fixtures differ'
          PY
      - name: Download pinned firmware pairing preview contract
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/CodingJaw/OMOTE-Firmware-WS2.8-OO/5640c2d451d0e34174a5b41fc21896491a5dc692/Platformio/tools/config-v2-tests/pairing_v1_preview_contract.json \
            -o /tmp/omote-contract/pairing.json
          python - <<'PY'
          import json
          from pathlib import Path
          upstream = json.loads(Path('/tmp/omote-contract/pairing.json').read_text())
          local = json.loads(Path('tests/fixtures/pairing_v1_preview_contract.json').read_text())
          assert upstream == local, 'Firmware and HACS pairing contract fixtures differ'
          PY
      - name: Compare pinned firmware Security2 lab key-proof contract
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/CodingJaw/OMOTE-Firmware-WS2.8-OO/979aefd441cb6d4a838deaca6c5303a21563fb56/Platformio/tools/config-v2-tests/sec2_lab_ha_proof_contract.json \
            -o /tmp/omote-contract/lab-ha-proof.json
          python - <<'PY'
          import json
          from pathlib import Path
          local = json.loads(Path('tests/fixtures/sec2_lab_ha_proof_contract.json').read_text())
          upstream = json.loads(Path('/tmp/omote-contract/lab-ha-proof.json').read_text())
          assert local == upstream, 'Firmware and HACS encrypted lab key-proof contracts differ'
          PY
      - name: Compare firmware LAB software device identity contract
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/CodingJaw/OMOTE-Firmware-WS2.8-OO/905508315a1b17cf005533a29a0b1698a93b15fb/Platformio/tools/config-v2-tests/sec2_lab_device_identity_contract.json \
            -o /tmp/omote-contract/lab-device-identity.json
          python - <<'PY'
          import json
          from pathlib import Path
          local = json.loads(Path('tests/fixtures/sec2_lab_device_identity_contract.json').read_text())
          upstream = json.loads(Path('/tmp/omote-contract/lab-device-identity.json').read_text())
          assert local == upstream, 'Firmware and HACS LAB device identity contracts differ'
          PY
      - name: Compare firmware LAB mutual-key proof review contract
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/CodingJaw/OMOTE-Firmware-WS2.8-OO/fd491dcb88ec51f2e55fcbec5704ebfdd6f5540c/Platformio/tools/config-v2-tests/sec2_lab_mutual_review_contract.json \
            -o /tmp/omote-contract/lab-mutual-review.json
          python - <<'PY'
          import json
          from pathlib import Path
          local = json.loads(Path('tests/fixtures/sec2_lab_mutual_review_contract.json').read_text())
          upstream = json.loads(Path('/tmp/omote-contract/lab-mutual-review.json').read_text())
          assert local == upstream, 'Firmware and HACS LAB mutual review contracts differ'
          PY
      - name: Compare firmware-owned production pairing lifecycle draft
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/CodingJaw/OMOTE-Firmware-WS2.8-OO/151d6702c1ada1bdfe864271f182533a7ffa7b0f/Platformio/tools/config-v2-tests/pairing_lifecycle_contract_v1.json \
            -o /tmp/omote-contract/pairing-lifecycle.json
          python - <<'PY'
          import json
          from pathlib import Path
          upstream = json.loads(Path('/tmp/omote-contract/pairing-lifecycle.json').read_text())
          local = json.loads(Path('tests/fixtures/pairing_lifecycle_contract_v1.json').read_text())
          assert upstream == local, 'Firmware and HACS pairing lifecycle draft differ'
          assert local['authorization']['laboratory_only'] is True, 'LAB mode must be marked laboratory-only'
          assert all(value is False for key, value in local['authorization'].items() if key != 'laboratory_only'), 'Production privileges must remain disabled'
          PY
      - name: Compare firmware-owned draft trust journal contract
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/CodingJaw/OMOTE-Firmware-WS2.8-OO/a54ba79a07bbb22fc99910c1dc95e6c450b7c574/Platformio/tools/config-v2-tests/trust_journal_contract_v1.json \
            -o /tmp/omote-contract/trust-journal.json
          python - <<'PY'
          import json
          from pathlib import Path
          upstream = json.loads(Path('/tmp/omote-contract/trust-journal.json').read_text())
          local = json.loads(Path('tests/fixtures/trust_journal_contract_v1.json').read_text())
          assert upstream == local, 'Firmware and HACS public trust journal contracts differ'
          assert local['authorization']['laboratory_only'] is True
          assert all(enabled is False for key, enabled in local['authorization'].items() if key != 'laboratory_only')
          assert local['protocol']['credentials_or_trust_writes_enabled'] is False
          PY
      - name: Compare firmware-owned signed enrollment receipt contract
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/CodingJaw/OMOTE-Firmware-WS2.8-OO/eea0682cba634d859896b7db8766565621a4c752/Platformio/tools/config-v2-tests/enrollment_receipt_contract_v1.json \
            -o /tmp/omote-contract/enrollment-receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          firmware = json.loads(Path('/tmp/omote-contract/enrollment-receipt.json').read_text())
          hacs = json.loads(Path('tests/fixtures/enrollment_receipt_contract_v1.json').read_text())
          assert firmware == hacs, 'Signed receipt protocol fixtures differ'
          assert hacs['authorization']['laboratory_only'] is True
          assert all(value is False for key, value in hacs['authorization'].items() if key != 'laboratory_only')
          assert hacs['scope'] == 'offline_signed_receipt_verification_only'
          PY
      - name: Compare signed receipt fixed interoperability vectors
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/CodingJaw/OMOTE-Firmware-WS2.8-OO/49760eac7acd4f070aa567c3f1f559f3a12a0624/Platformio/tools/config-v2-tests/enrollment_receipt_vectors_v1.json \
            -o /tmp/omote-contract/enrollment-receipt-vectors.json
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('/tmp/omote-contract/enrollment-receipt-vectors.json').read_text())
          b=json.loads(Path('tests/fixtures/enrollment_receipt_vectors_v1.json').read_text())
          assert a==b, 'Signed receipt interoperability test vectors differ'
          assert len(b['vectors'])==2
          PY
      - name: Compile Python modules
        run: python -m compileall -q custom_components tests
      - name: Validate configuration form serializer
        env:
          OMOTE_FIRMWARE_CONTRACT: /tmp/omote-contract/preview.json
          OMOTE_FIRMWARE_PAIRING_LIFECYCLE: /tmp/omote-contract/pairing-lifecycle.json
          OMOTE_FIRMWARE_TRUST_JOURNAL_CONTRACT: /tmp/omote-contract/trust-journal.json
          OMOTE_FIRMWARE_ENROLLMENT_RECEIPT_CONTRACT: /tmp/omote-contract/enrollment-receipt.json
          OMOTE_FIRMWARE_PAIRING_CONTRACT: /tmp/omote-contract/pairing.json
          OMOTE_FIRMWARE_LAB_PROOF_CONTRACT: /tmp/omote-contract/lab-ha-proof.json
          OMOTE_FIRMWARE_LAB_DEVICE_CONTRACT: /tmp/omote-contract/lab-device-identity.json
          OMOTE_FIRMWARE_LAB_MUTUAL_REVIEW_CONTRACT: /tmp/omote-contract/lab-mutual-review.json
        run: python -m unittest discover -s tests -v
      - name: Validate sidebar JavaScript
        run: |
          node --check custom_components/omote_manager/frontend/omote-panel.js
          node --check --input-type=module < custom_components/omote_manager/frontend/workspace-panel.js
          node --check --input-type=module < custom_components/omote_manager/frontend/scene-editor.js
          node --check --input-type=module < custom_components/omote_manager/frontend/layout-editor.js
      - name: Validate JSON metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path('hacs.json').read_text())
          for path in Path('custom_components').rglob('*.json'):
              json.loads(path.read_text())
          print('JSON metadata valid')
          PY
