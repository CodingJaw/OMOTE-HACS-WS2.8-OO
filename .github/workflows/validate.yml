name: Validate integration
on:
  push:
    branches: [develop, main]
  pull_request:
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install form test dependencies (versions from HA 2024.9.1)
        run: python -m pip install voluptuous==0.15.2 voluptuous-serialize==2.6.0
      - name: Compile Python modules
        run: python -m compileall -q custom_components tests
      - name: Validate configuration form serializer
        run: python -m unittest discover -s tests -v
      - name: Validate sidebar JavaScript
        run: node --check custom_components/omote_manager/frontend/omote-panel.js
      - name: Validate JSON metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path('hacs.json').read_text())
          for path in Path('custom_components').rglob('*.json'):
              json.loads(path.read_text())
          print('JSON metadata valid')
          PY
